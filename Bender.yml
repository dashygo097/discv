package:
  name: discv
  description: Configurable RISC-V CPU and simulation platform

dependencies:
  amba: { git: "https://github.com/dashygo097/amba.git", rev: main }
  common_cells:
    { git: "https://github.com/dashygo097/common_cells.git", rev: main }
  dicflow: { git: "https://github.com/dashygo097/dicflow.git", rev: main }

sources:
  - rtl/pkgs/riscv_pkg.sv
  - rtl/pkgs/core_pkg.sv
  - rtl/core/**/*.sv
  - rtl/bridges/**/*.sv
  - rtl/tops/**/*.sv
  - target: simulation
    files:
      - sim/rtl/demu_dpi_pkg.sv
      - sim/rtl/demu_retire_monitor.sv
      - sim/rtl/**/*_bfm.sv
      - sim/rtl/demu_sim_top.sv
