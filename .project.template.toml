schema_version = 3

[parameters]
XLEN = 32
RESET_VECTOR = 0x80000000

[rtl]
top = ""

[rtl.defines]

[[rtl.filesets]]
name = "packages"
roots = ["rtl/pkgs"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "protocols"
roots = ["rtl/protocols"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "design"
roots = ["rtl/core"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "top"
roots = ["rtl/top"]
patterns = ["**/*.sv"]

[build]
jobs = 1

[environment]
required_commands = ["bash"]
required_variables = []

