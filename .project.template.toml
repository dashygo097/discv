schema_version = 1

[parameters]
XLEN = 32

[rtl]
top = ""

[rtl.defines]

[[rtl.filesets]]
name = "packages"
roots = ["rtl/include/pkgs"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "design"
roots = ["rtl/core", "rtl/bus"]
patterns = ["**/*.sv", "**/*.v"]

[[rtl.filesets]]
name = "top"
roots = ["rtl/top"]
patterns = ["**/*.sv"]

[build]
jobs = 1

[environment]
python = "python3"
required_commands = ["bash"]
required_variables = []

[flow.lint]
enabled = false
tool = ""
options = []

[workflow]
stages = []
