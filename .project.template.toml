schema_version = 5

[architecture]
march = "rv32i"
top = ""
reset_vector = 0x00000000

[rtl]

[[rtl.filesets]]
name = "packages"
roots = ["rtl/pkgs"]
# NOTE: list in turn for dependencies
patterns = ["cfg_pkg.sv", "riscv_pkg.sv", "core_types_pkg.sv"]

[[rtl.filesets]]
name = "protocols"
roots = ["rtl/protocols"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "tech"
roots = ["rtl/tech"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "lib"
roots = ["rtl/lib"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "design"
roots = ["rtl/core"]
patterns = ["**/*.sv"]

[[rtl.filesets]]
name = "top"
roots = ["rtl/top"]
patterns = ["**/*.sv"]

[build]
jobs = 1

[environment]
required_commands = ["bash"]
required_variables = []

