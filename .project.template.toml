schema_version = 7

[design]
top = ""

[architecture]
generator = "scripts/project/riscv_config.py"
march = "rv32i"
reset_vector = 0x00000000

[technology.generic]
targets = ["generic"]

[flow.lint.verilator]
options = ["-Wno-fatal"]

[flow.sim.demu]
backend = "scripts/sim/demu_backend.py"
targets = ["simulation"]
options = ["-Wall", "-Wno-fatal"]
reset_cycles = 5
max_cycles = 1000000
ports = [
  { name = "imem", protocol = "virt" },
  { name = "dmem", protocol = "virt" },
]
devices = [
  { name = "imem", type = "tcm", base = 0x00000000, size = 0x01000000, load_address = 0x00000000 },
  { name = "dmem", type = "tcm", base = 0x80000000, size = 0x01000000 },
  { name = "host_exit", type = "host_exit", base = 0x10000000, size = 4 },
  { name = "console", type = "console", base = 0x10000004, size = 4 },
]

[constraints]
clocks = [
  { name = "clk_i", period = 10.0, waveform = [
    0.0,
    5.0,
  ], setup_uncertainty = 0.20, hold_uncertainty = 0.05, transition = 0.10 },
]
input_delays = [
  { clock = "clk_i", ports = [
    "imem_*_i",
    "dmem_*_i",
  ], max = 2.0, min = 0.2 },
]
output_delays = [
  { clock = "clk_i", ports = [
    "imem_*_o",
    "dmem_*_o",
    "retire_*_o",
  ], max = 2.0, min = 0.2 },
]
input_transitions = [
  { ports = [
    "rst_n_i",
    "imem_*_i",
    "dmem_*_i",
  ], rise = 0.10, fall = 0.10 },
]
output_loads = [
  { ports = [
    "imem_*_o",
    "dmem_*_o",
    "retire_*_o",
  ], capacitance = 0.05 },
]
design_rules = { max_transition = 0.50, max_fanout = 16, max_capacitance = 0.20 }

